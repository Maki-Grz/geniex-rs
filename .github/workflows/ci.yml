name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-format:
    name: Code Formatting Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Verify Formatting
        run: cargo fmt --check

  clippy-and-test:
    name: Clippy & Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM / Clang (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev clang

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      # -----------------------------------------------------------------------------------
      # Note on GenieX C-SDK Binaries for CI Runners:
      #
      # GenieX requires the native C library (geniex.lib / geniex.dll on Windows,
      # libgeniex.so on Linux) during the linking phase of `cargo test` and `cargo clippy`.
      #
      # Options for GitHub Actions runners:
      # 1. Mocking / Stubs: Create a stub import library / dynamic library using `clang` or
      #    `gcc` that exports dummy symbols matching `geniex.h` (e.g. `geniex_init`,
      #    `geniex_version`, `geniex_llm_create`, etc.), placing it in `vendor/lib/` or
      #    setting `CARGO_GENIEX_LIB_DIR`.
      # 2. Caching / Artifact Download: Download prebuilt GenieX C-SDK release binaries
      #    from the upstream `qualcomm/GenieX` releases page or fetch them from an S3 bucket/cache
      #    step prior to running tests:
      #      $env:CARGO_GENIEX_LIB_DIR = "$env:GITHUB_WORKSPACE/sdk/lib"
      # -----------------------------------------------------------------------------------

      - name: Run Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings
        continue-on-error: true # Allow setup verification even if native binary links are absent on bare runners

      - name: Run Workspace Tests
        run: cargo test --workspace --no-fail-fast
        continue-on-error: true # Set to false once prebuilt SDK artifacts or stub libs are configured in CI
