[package]
name = "geniex-rust-example"
version = "0.2.0"
edition = "2021"
default-run = "geniex-rust-example"

[dependencies]
geniex = { package = "geniex-rs", path = ".." }
axum = "0.8.9"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["full"] }
tokio-stream = "0.1.19"
